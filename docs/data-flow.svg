<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 840" width="1180" height="840" font-family="Georgia, 'Times New Roman', serif">
  <title>GoodName data flow: one audit, from request to report</title>
  <desc>How personal data enters, moves through and leaves the system during a single self-audit.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2b2b2b"/>
    </marker>
    <marker id="arrowStop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9a2a2a"/>
    </marker>
  </defs>

  <style>
    .bg    { fill: #ffffff; }
    .box   { fill: #ffffff; stroke: #2b2b2b; stroke-width: 1.4; }
    .store { fill: #f4f1ea; stroke: #2b2b2b; stroke-width: 1.4; }
    .ghost { fill: #ffffff; stroke: #8a8a8a; stroke-width: 1.4; stroke-dasharray: 6 4; }
    .stop  { fill: #ffffff; stroke: #9a2a2a; stroke-width: 1.4; }
    .t     { fill: #1a1a1a; font-size: 15px; }
    .tb    { fill: #1a1a1a; font-size: 15px; font-weight: bold; }
    .s     { fill: #4a4a4a; font-size: 12.5px; }
    .red   { fill: #9a2a2a; font-size: 12.5px; }
    .band  { fill: #1a1a1a; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
    .rule  { stroke: #d6d0c4; stroke-width: 1; }
    .line  { stroke: #2b2b2b; stroke-width: 1.4; fill: none; marker-end: url(#arrow); }
    .lineR { stroke: #9a2a2a; stroke-width: 1.4; fill: none; marker-end: url(#arrowStop); }
    .dash  { stroke: #8a8a8a; stroke-width: 1.4; fill: none; stroke-dasharray: 6 4; marker-end: url(#arrow); }
  </style>

  <rect class="bg" x="0" y="0" width="1180" height="840"/>

  <text class="tb" x="40" y="44" font-size="21">GoodName — data flow for one self-audit</text>
  <text class="s" x="40" y="66">Drawn from the code at commit 03e36f0. Dashed boxes are not connected to anything live.</text>

  <!-- ============ BAND 1: request ============ -->
  <line class="rule" x1="40" y1="90" x2="1140" y2="90"/>
  <text class="band" x="40" y="110">1 · The request, in the request thread</text>

  <rect class="box" x="40" y="126" width="180" height="84" rx="3"/>
  <text class="tb" x="56" y="150">Customer</text>
  <text class="s" x="56" y="170">Name, profession,</text>
  <text class="s" x="56" y="187">employer, city, site</text>
  <text class="s" x="56" y="204">+ attestation</text>

  <rect class="box" x="272" y="126" width="180" height="84" rx="3"/>
  <text class="tb" x="288" y="150">The gate</text>
  <text class="s" x="288" y="170">Self-audit only</text>
  <text class="s" x="288" y="187">5 audits / 24h</text>
  <text class="s" x="288" y="204">2 distinct names</text>

  <rect class="stop" x="272" y="246" width="180" height="62" rx="3"/>
  <text class="red" x="288" y="270" font-weight="bold">Refused</text>
  <text class="red" x="288" y="290">No scan, no job,</text>
  <text class="red" x="288" y="303" font-size="11.5">no search, no cost</text>

  <rect class="store" x="504" y="126" width="168" height="84" rx="3"/>
  <text class="tb" x="520" y="150">Job queue</text>
  <text class="s" x="520" y="170">Audits are jobs,</text>
  <text class="s" x="520" y="187">never requests</text>
  <text class="s" x="520" y="204">(payload: identity)</text>

  <rect class="ghost" x="724" y="126" width="196" height="84" rx="3"/>
  <text class="tb" x="740" y="150">Search provider</text>
  <text class="s" x="740" y="170">NOT CONNECTED</text>
  <text class="s" x="740" y="187">Every run today uses</text>
  <text class="s" x="740" y="204">fixture data</text>

  <rect class="store" x="972" y="126" width="168" height="84" rx="3"/>
  <text class="tb" x="988" y="150">audit_attempts</text>
  <text class="s" x="988" y="170">Requester + name,</text>
  <text class="s" x="988" y="187">for enumeration</text>
  <text class="s" x="988" y="204">detection · 30 days</text>

  <path class="line" d="M 220 168 L 266 168"/>
  <path class="lineR" d="M 362 210 L 362 242"/>
  <path class="line" d="M 452 168 L 498 168"/>
  <path class="dash" d="M 672 168 L 718 168"/>
  <path class="line" d="M 362 126 C 520 68 880 64 1056 120" stroke-dasharray="3 3"/>
  <text class="s" x="760" y="58" font-style="italic">allowed attempts only · a refusal records nothing</text>

  <!-- ============ BAND 2: evidence pipeline ============ -->
  <line class="rule" x1="40" y1="340" x2="1140" y2="340"/>
  <text class="band" x="40" y="360">2 · Evidence built, in the job — order matters</text>

  <rect class="box" x="40" y="376" width="196" height="92" rx="3"/>
  <text class="tb" x="56" y="400">a. Match identity</text>
  <text class="s" x="56" y="420">Confirmed ≥ 0.85</text>
  <text class="s" x="56" y="437">Probable ≥ 0.6</text>
  <text class="s" x="56" y="454">Uncertain → ask them</text>

  <rect class="box" x="268" y="376" width="196" height="92" rx="3"/>
  <text class="tb" x="284" y="400">b. Classify</text>
  <text class="s" x="284" y="420">Deterministic code,</text>
  <text class="s" x="284" y="437">no model call.</text>
  <text class="s" x="284" y="454">Unsure → uncertain</text>

  <rect class="box" x="496" y="376" width="196" height="92" rx="3"/>
  <text class="tb" x="512" y="400">c. Cluster</text>
  <text class="s" x="512" y="420">Reprints collapse.</text>
  <text class="s" x="512" y="437">A cluster is what</text>
  <text class="s" x="512" y="454">promotes a finding</text>

  <rect class="box" x="724" y="376" width="216" height="92" rx="3"/>
  <text class="tb" x="740" y="400">d. Redact, then store</text>
  <text class="s" x="740" y="420">Special category →</text>
  <text class="s" x="740" y="437">title and excerpt gone</text>
  <text class="s" x="740" y="454">BEFORE the row exists</text>

  <path class="line" d="M 236 422 L 262 422"/>
  <path class="line" d="M 464 422 L 490 422"/>
  <path class="line" d="M 692 422 L 718 422"/>

  <text class="s" x="972" y="400" font-style="italic">URL, source and date</text>
  <text class="s" x="972" y="417" font-style="italic">are kept. The report</text>
  <text class="s" x="972" y="434" font-style="italic">says we withheld it.</text>
  <text class="s" x="972" y="451" font-style="italic">Never the matched word.</text>

  <!-- ============ BAND 3: stores and outputs ============ -->
  <line class="rule" x1="40" y1="500" x2="1140" y2="500"/>
  <text class="band" x="40" y="520">3 · What is stored, and what is rebuilt each time it is read</text>

  <rect class="store" x="40" y="536" width="212" height="112" rx="3"/>
  <text class="tb" x="56" y="560">evidence</text>
  <text class="s" x="56" y="580">Title + excerpt =</text>
  <text class="s" x="56" y="597">the personal data</text>
  <text class="s" x="56" y="620">Expires: 180 days,</text>
  <text class="s" x="56" y="637">whole scan at once</text>

  <rect class="store" x="284" y="536" width="212" height="112" rx="3"/>
  <text class="tb" x="300" y="560">snapshots</text>
  <text class="s" x="300" y="580">Score, coverage,</text>
  <text class="s" x="300" y="597">methodology version</text>
  <text class="s" x="300" y="620">Append-only.</text>
  <text class="s" x="300" y="637">Kept indefinitely</text>

  <rect class="box" x="528" y="536" width="212" height="112" rx="3"/>
  <text class="tb" x="544" y="560">Report</text>
  <text class="s" x="544" y="580">Recomputed on read,</text>
  <text class="s" x="544" y="597">never stored rendered</text>
  <text class="s" x="544" y="620">Expired scan says so;</text>
  <text class="s" x="544" y="637">it does not look empty</text>

  <rect class="box" x="772" y="536" width="168" height="112" rx="3"/>
  <text class="tb" x="788" y="560">Customer</text>
  <text class="s" x="788" y="580">Screen, print,</text>
  <text class="s" x="788" y="597">JSON export</text>
  <text class="s" x="788" y="620">Permitted use is</text>
  <text class="s" x="788" y="637">first in all three</text>

  <rect class="box" x="972" y="536" width="168" height="112" rx="3"/>
  <text class="tb" x="988" y="560">Reviewer</text>
  <text class="s" x="988" y="580">Flagged records only</text>
  <text class="s" x="988" y="600">Every read logged</text>
  <text class="s" x="988" y="620">Rationale required</text>
  <text class="s" x="988" y="640">Never withheld items</text>

  <path class="line" d="M 252 592 L 282 592"/>
  <path class="line" d="M 496 592 L 522 592"/>
  <path class="line" d="M 740 592 L 766 592"/>
  <path class="line" d="M 146 468 L 146 532"/>
  <path class="line" d="M 940 468 C 1010 490 1030 500 1052 532"/>

  <text class="s" x="988" y="666" font-style="italic">The one operation</text>
  <text class="s" x="988" y="683" font-style="italic">crossing accounts</text>

  <!-- ============ BAND 4: clocks ============ -->
  <line class="rule" x1="40" y1="706" x2="1140" y2="706"/>
  <text class="band" x="40" y="726">4 · On a clock, because the server started — not because a customer did something</text>

  <rect class="box" x="40" y="742" width="330" height="72" rx="3"/>
  <text class="tb" x="56" y="766">Retention sweep · hourly</text>
  <text class="s" x="56" y="786">Evidence 180d · reviewer decisions 730d</text>
  <text class="s" x="56" y="803">access log 730d · jobs, sessions, outbox, attempts 30d</text>

  <rect class="box" x="402" y="742" width="330" height="72" rx="3"/>
  <text class="tb" x="418" y="766">Deletion purge · hourly</text>
  <text class="s" x="418" y="786">Requested → 30-day grace → hard purge.</text>
  <text class="s" x="418" y="803">Cancellable. Access log anonymised, not destroyed.</text>

  <rect class="ghost" x="764" y="742" width="376" height="72" rx="3"/>
  <text class="tb" x="780" y="766">No backups exist</text>
  <text class="s" x="780" y="786">One SQLite file on one machine. Nothing replicates,</text>
  <text class="s" x="780" y="803">snapshots or ships it. A gap to close, not a feature.</text>
</svg>
